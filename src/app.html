<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<!-- Self-hosted; see static/fonts/pretendard.css for why. The Latin
		     subset covers the wordmark and navigation, so it is worth preloading;
		     the hangul chunks are picked per-page by unicode-range. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/PretendardVariable.subset.91.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/pretendard.css" />

		<!-- Single light theme; keep in sync with --bg in src/lib/styles/tokens.css. -->
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#fbfbf8" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
